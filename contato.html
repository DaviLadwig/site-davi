<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/davi-logo__1_-removebg-preview.png" alt="logo">
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="contato.html">Contato</a>

        </nav>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div class="overlay" id="overlay"></div>

    <!--ENTRE EM CONTATO-->
    <div id="contact">
        <div class="contact-container">
            <span style="font-size: 2.3rem;">Entre em contato e vamos conversar!</span>
            <p>preencha o formulário👇</p>
            <div class="main-contacts">

                <section class="form-section">

                    <form id="contactForm" class="contact-form">

                        <div class="input-group">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                        </div>

                        <div class="input-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="Seu e-mail" required>
                        </div>

                        <div class="input-group">
                            <label for="whatsapp">WhatsApp</label>
                            <input type="text" id="whatsapp" name="whatsapp" placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="input-group">
                            <label for="mensagem">Mensagem</label>
                            <textarea id="mensagem" name="mensagem" placeholder="Digite aqui o segmento da sua área"
                                required></textarea>
                        </div>

                        <!-- CONFIGURAÇÕES OBRIGATÓRIAS -->
                        <input type="hidden" name="_captcha" value="false">
                        <input type="hidden" name="_template" value="box">
                        <input type="hidden" name="_subject" value="Novo contato do site">

                        <button type="submit" class="btn-form">Enviar Mensagem</button>
                    </form>

                    <!-- MODAL DE SUCESSO -->
                    <div id="successModal" class="modal">
                        <div class="modal-content">
                            <h2 style="color: black;">Formulário enviado com sucesso 🚀</h2>
                            <p style="color: black;">Em breve nossa equipe entrará em contato com você.</p>
                            <button onclick="window.location.href='index.html'">Voltar ao início</button>
                        </div>
                    </div>

                </section>

                <a href="https://wa.me/5598991713898?text=Ol%C3%A1%20Davi,%20gostaria%20de%20agendar%20uma%20consultoria%20gratuita%20para%20falarmos%20sobre%20meu%20projeto."
                    target="_blank"><img src="images/whatsapp (1).png" alt="whatsapp-icone" width="20px">Somente
                    dúvidas
                    ou suporte
                </a>
                <a href="mailto:contato@empresa.com"><img src="images/correspondencia.png" alt="E-mail-icone"
                        width="20px"> E-mail: daviladwigdev@gmail.com
                </a>



                </section>
            </div>

        </div>
    </div>

    <footer class="rodape-contato">
        <p>  © 2025 Copyright by <span style="font-weight: bold; color: #086cef;">Davi Ladwig dev</span> - Todos os direitos reservados</p>
    </footer>



    <script src="script.js"></script>
</body>

</html>
